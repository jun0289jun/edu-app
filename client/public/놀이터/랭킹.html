<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>랭킹</title>
<link rel="stylesheet" href="kid.css">
<style>
  #wrap{flex:1;overflow-y:auto;padding:10px 12px 24px;width:min(680px,96vw);margin:0 auto;}
  #me{display:flex;align-items:center;gap:10px;justify-content:center;font-size:22px;font-weight:800;
    background:#fff8;border-radius:16px;padding:10px 14px;margin-bottom:12px;}
  #me .av{font-size:34px;} #me a{margin-left:auto;font-size:15px;color:#5b6cf0;text-decoration:none;font-weight:800;}
  .card{background:#fff;border-radius:18px;box-shadow:0 5px 14px #0002;padding:12px 14px;margin-bottom:14px;}
  .gh{font-size:22px;font-weight:800;margin-bottom:8px;}
  .row{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;padding:7px 6px;border-radius:12px;}
  .row+.row{border-top:2px dashed #eee;}
  .row.top1{background:linear-gradient(90deg,#fff6d6,#fff);}
  .rk{width:44px;text-align:center;font-size:24px;}
  .av{font-size:30px;} .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sc{color:#ff7f3a;font-variant-numeric:tabular-nums;}
  #msg{text-align:center;font-size:19px;font-weight:800;color:#555;line-height:1.6;margin-top:8px;}
  #load{text-align:center;font-size:20px;font-weight:800;color:#888;padding:20px;}
</style>
</head>
<body>
  <div class="topbar"><a class="home" href="index.html">🏠 홈</a><span class="title">🏆 랭킹</span></div>
  <div id="wrap">
    <div id="me"></div>
    <div id="load">불러오는 중… ⏳</div>
    <div id="list"></div>
    <div id="msg"></div>
  </div>
<script src="kid.js"></script>
<script>
  var listEl=document.getElementById('list'), msgEl=document.getElementById('msg'),
      loadEl=document.getElementById('load'), meEl=document.getElementById('me');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function medal(i){ return ['🥇','🥈','🥉'][i]||('<span style="font-size:17px;color:#999">'+(i+1)+'등</span>'); }
  function label(k){ var g=KID.GAMES[k]; return g?(g[0]+' '+g[1]):('🎮 '+esc(k)); }

  // 내 프로필 배지
  (function(){ var p=KID.profile();
    if(p&&p.name){ meEl.innerHTML='<span class="av">'+esc(p.avatar||'🐥')+'</span><span>'+esc(p.name)+'</span><a href="index.html">✏️ 바꾸기</a>'; }
    else { meEl.innerHTML='<span class="av">👤</span><span style="font-size:18px">이름을 정해요!</span><a href="index.html">➡️ 정하러 가기</a>'; }
  })();

  function renderOnline(data){
    var games=(data&&data.games)||{};
    var keys=Object.keys(KID.GAMES).filter(function(k){ return games[k]&&games[k].length; });
    Object.keys(games).forEach(function(k){ if(keys.indexOf(k)<0 && games[k]&&games[k].length) keys.push(k); });
    if(!keys.length){ listEl.innerHTML=''; msgEl.textContent='아직 점수가 없어요. 게임을 해보자! 🎮'; return; }
    var me=KID.profile(), myName=me&&me.name;
    var html='';
    keys.forEach(function(k){
      html+='<div class="card"><div class="gh">'+label(k)+'</div>';
      games[k].slice(0,5).forEach(function(r,i){
        var mine=(r.name===myName)?' style="outline:3px solid #ffd21a"':'';
        html+='<div class="row'+(i===0?' top1':'')+'"'+mine+'><span class="rk">'+medal(i)+'</span>'+
              '<span class="av">'+esc(r.avatar||'🐥')+'</span><span class="nm">'+esc(r.name)+'</span>'+
              '<span class="sc">'+(parseInt(r.score,10)||0)+'</span></div>';
      });
      html+='</div>';
    });
    listEl.innerHTML=html; msgEl.textContent='';
  }

  function renderLocal(note){
    var p=KID.profile(), html='';
    Object.keys(KID.GAMES).forEach(function(k){ var s=KID.hiGet(k); if(!s) return;
      html+='<div class="card"><div class="gh">'+label(k)+'</div><div class="row top1">'+
            '<span class="rk">🏆</span><span class="av">'+esc((p&&p.avatar)||'🐥')+'</span>'+
            '<span class="nm">'+esc((p&&p.name)||'나')+'</span><span class="sc">'+s+'</span></div></div>';
    });
    listEl.innerHTML=html; msgEl.innerHTML=note+(html?'':'<br>아직 기록이 없어요. 게임해보자! 🎮');
  }

  KID.fetchRanks(function(data,err){
    loadEl.style.display='none';
    if(err==='offline'){ renderLocal('🔌 인터넷에 연결되면 친구들 순위가 보여요.<br>지금은 <b>내 기록</b>만!'); }
    else if(err){ renderLocal('😅 순위를 못 불러왔어요. 잠시 후 다시!<br>지금은 <b>내 기록</b>만!'); }
    else { renderOnline(data); }
  });
</script>
</body>
</html>
