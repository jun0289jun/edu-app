<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>별잡기</title>
<link rel="stylesheet" href="kid.css">
<style>
  #hud{display:flex;gap:14px;align-items:center;justify-content:center;font-size:20px;font-weight:800;padding:2px;}
  #bar{height:14px;background:#fff6;border-radius:8px;margin:4px 12px;overflow:hidden;}
  #fill{height:100%;width:100%;background:linear-gradient(90deg,#38c66b,#ffd21a,#ff5252);transition:width .1s linear;}
  #bwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 10px;}
  #board{position:relative;aspect-ratio:9/7;height:100%;max-width:100%;border-radius:18px;background:
    repeating-linear-gradient(45deg,#eafaf0,#eafaf0 40px,#dff4e8 40px,#dff4e8 80px);
    box-shadow:inset 0 0 0 4px #fff,0 6px 18px #0003;overflow:hidden;}
  .sprite{position:absolute;transform:translate(-50%,-50%);transition:left .08s,top .08s;line-height:1;}
  #star{animation:pop .6s infinite alternate;}
  @keyframes pop{to{transform:translate(-50%,-50%) scale(1.18);}}
  .wall{position:absolute;transform:translate(-50%,-50%);font-size:34px;line-height:1;}
  #pad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);gap:8px;justify-content:center;padding:4px 0 10px;}
  #pad button{font-size:32px;border:none;border-radius:16px;background:#fff;box-shadow:0 4px 0 #0002;}
  #pad button:active{transform:translateY(3px);}
  .up{grid-area:1/2;}.left{grid-area:2/1;}.right{grid-area:2/3;}.down{grid-area:3/2;}
  #over{position:absolute;inset:0;background:#000a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;border-radius:18px;}
  #over.on{display:flex;} #over .big{font-size:34px;font-weight:800;}
</style>
</head>
<body>
  <div class="topbar"><a class="home" href="게임.html">🏠 게임</a><span class="title">⭐ 별잡기</span></div>
  <div id="hud"><span id="score">⭐ 0</span><span id="life">❤️❤️❤️</span><span id="hi">🏆 0</span></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="bwrap"><div id="board">
    <div class="sprite" id="star" style="font-size:40px">⭐</div>
    <div class="sprite" id="hero" style="font-size:44px">🐢</div>
    <div id="over"><div class="big" id="ovtxt"></div><button class="btn" id="again" style="background:#8be78b;font-size:24px">다시 하기 ▶</button></div>
  </div></div>
  <div id="pad">
    <button class="up" data-d="U">⬆️</button><button class="left" data-d="L">⬅️</button>
    <button class="right" data-d="R">➡️</button><button class="down" data-d="D">⬇️</button>
  </div>
<script src="kid.js"></script>
<script>
  var COLS=9, ROWS=7;
  var board=document.getElementById('board'), hero=document.getElementById('hero'), star=document.getElementById('star');
  var hx,hy,sx,sy,score,lives,walls,starTime,starLeft,playing,timer;
  function cell(x,y){ return x+','+y; }
  function place(el,x,y){ el.style.left=((x+0.5)/COLS*100)+'%'; el.style.top=((y+0.5)/ROWS*100)+'%'; }
  function isWall(x,y){ return walls.indexOf(cell(x,y))>=0; }
  function draw(){ place(hero,hx,hy); place(star,sx,sy); }
  function drawWalls(){ board.querySelectorAll('.wall').forEach(function(w){w.remove();});
    walls.forEach(function(c){ var p=c.split(','),w=document.createElement('div'); w.className='wall'; w.textContent='🧱';
      w.style.left=((+p[0]+0.5)/COLS*100)+'%'; w.style.top=((+p[1]+0.5)/ROWS*100)+'%'; board.appendChild(w); }); }
  function reachSet(){ var seen={}, q=[[hx,hy]]; seen[cell(hx,hy)]=1;
    while(q.length){ var c=q.shift(); [[0,-1],[0,1],[-1,0],[1,0]].forEach(function(d){ var nx=c[0]+d[0], ny=c[1]+d[1];
      if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&!isWall(nx,ny)&&!seen[cell(nx,ny)]){ seen[cell(nx,ny)]=1; q.push([nx,ny]); } }); } return seen; }
  function reachableCells(){ var r=reachSet(), out=[]; for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){ if(r[cell(x,y)]&&!(x===hx&&y===hy)) out.push([x,y]); } return out; }
  function addWall(){ if(walls.length>=COLS*ROWS-14) return; var tries=0;
    while(tries++<40){ var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if((x===hx&&y===hy)||(x===sx&&y===sy)||isWall(x,y)) continue;
      walls.push(cell(x,y)); if(reachSet()[cell(sx,sy)]){ drawWalls(); return; } else walls.pop(); } }
  function newStar(){ var cells=reachableCells(); if(!cells.length){ walls=[]; drawWalls(); cells=reachableCells(); }
    var e=cells[Math.floor(Math.random()*cells.length)]; sx=e[0]; sy=e[1];
    // 시작은 여유있게, 점수 오를수록 점점 빨라짐(완만하게)
    starTime=Math.max(1.7, 5.0 - score*0.07); starLeft=starTime; draw(); updBar(); }
  function updHud(){ document.getElementById('score').textContent='⭐ '+score;
    document.getElementById('life').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives); }
  function updBar(){ document.getElementById('fill').style.width=Math.max(0,starLeft/starTime*100)+'%'; }
  function start(){ hx=Math.floor(COLS/2); hy=Math.floor(ROWS/2); score=0; lives=3; walls=[]; playing=true;
    document.getElementById('over').classList.remove('on'); document.getElementById('hi').textContent='🏆 '+KID.hiGet('starcatch');
    drawWalls(); newStar(); draw(); updHud();
    clearInterval(timer); timer=setInterval(tick,100); }
  function tick(){ if(!playing)return; starLeft-=0.1; updBar(); if(starLeft<=0){ missStar(); } }
  function missStar(){ lives--; updHud(); KID.bad(); if(lives<=0){ return gameOver(); } newStar(); }
  function gameOver(){ playing=false; clearInterval(timer); var rec=KID.hiSet('starcatch',score); KID.fanfare();
    document.getElementById('ovtxt').innerHTML=(rec?'🏆 신기록!<br>':'')+'⭐ '+score+'개!';
    document.getElementById('hi').textContent='🏆 '+KID.hiGet('starcatch'); document.getElementById('over').classList.add('on'); }
  function move(d){ if(!playing)return; var nx=hx,ny=hy;
    if(d==='U')ny--; else if(d==='D')ny++; else if(d==='L')nx--; else if(d==='R')nx++;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS||isWall(nx,ny)) return;
    hx=nx; hy=ny; KID.click(); draw();
    if(hx===sx&&hy===sy){ score++; KID.star(); updHud(); if(score%4===0){ addWall(); } newStar(); } }
  document.addEventListener('keydown',function(e){ var m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};
    if(m[e.key]){ e.preventDefault(); move(m[e.key]); } });
  document.querySelectorAll('#pad button').forEach(function(b){ b.addEventListener('click',function(){ move(b.dataset.d); }); });
  document.getElementById('again').addEventListener('click',function(){ KID.pop(); start(); });
  window.addEventListener('resize',function(){ draw(); drawWalls(); });
  start();
</script>
</body>
</html>
