<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>글자놀이</title>
<link rel="stylesheet" href="kid.css">
<style>
  #g{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;align-content:center;
     width:min(760px,94vw);margin:0 auto;padding:10px;}
  a.tile{text-decoration:none;color:#fff;border-radius:24px;padding:30px 10px;font-size:26px;font-weight:800;
    box-shadow:0 8px 0 #0003,0 12px 24px #0003;display:flex;flex-direction:column;gap:8px;align-items:center;}
  a.tile .emo{font-size:64px;} a.tile:active{transform:translateY(6px);}
  .k1{background:linear-gradient(#9aa7ff,#5b6cf0);} .k2{background:linear-gradient(#5ad1c8,#1fb6a6);}
  .k3{background:linear-gradient(#ffb3a0,#ff6f52);} .k4{background:linear-gradient(#a0d8b0,#4bbf7a);}
  .k5{background:linear-gradient(#8be0d0,#2ac6a0);}
</style>
</head>
<body>
  <div class="topbar"><a class="home" href="index.html">🏠 홈</a><span class="title">🏰 글자놀이</span></div>
  <div id="g">
    <a class="tile k1" href="타자연습.html"><span class="emo">⌨️</span>타자연습</a>
    <a class="tile k2" href="따라쓰기.html"><span class="emo">✍️</span>따라쓰기</a>
    <a class="tile k3" href="지우기.html"><span class="emo">⌫</span>지우기</a>
    <a class="tile k4" href="줄바꿈.html"><span class="emo">⏎</span>줄바꿈</a>
    <a class="tile k5" href="띄어쓰기.html"><span class="emo">⎵</span>띄어쓰기</a>
  </div>
<script src="kid.js?v=3"></script>
<script>document.querySelectorAll('a.tile').forEach(function(t){t.addEventListener('click',function(){KID.pop();});});</script>
</body>
</html>
