<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>미로</title>
<link rel="stylesheet" href="kid.css">
<style>
  #hud{display:flex;gap:16px;justify-content:center;font-size:20px;font-weight:800;padding:2px;}
  #wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px;}
  canvas{background:#fff;border-radius:16px;box-shadow:inset 0 0 0 4px #fff,0 6px 18px #0003;max-width:100%;max-height:100%;touch-action:none;}
  #pad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);gap:8px;justify-content:center;padding:4px 0 10px;}
  #pad button{font-size:32px;border:none;border-radius:16px;background:#fff;box-shadow:0 4px 0 #0002;}
  #pad button:active{transform:translateY(3px);}
  .up{grid-area:1/2;}.left{grid-area:2/1;}.right{grid-area:2/3;}.down{grid-area:3/2;}
  #cheer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:100px;pointer-events:none;opacity:0;z-index:5;}
</style>
</head>
<body>
  <div class="topbar"><a class="home" href="게임.html">🏠 게임</a><span class="title">🌀 미로</span></div>
  <div id="hud"><span id="lv">미로 1</span><span id="hi">🏆 0</span></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="pad">
    <button class="up" data-d="U">⬆️</button><button class="left" data-d="L">⬅️</button>
    <button class="right" data-d="R">➡️</button><button class="down" data-d="D">⬇️</button>
  </div>
  <div id="cheer">🎉</div>
<script src="kid.js?v=3"></script>
<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var g,cols,rows,px,py,level=1,S=32;
  function gen(c,r){
    var m=[]; for(var y=0;y<r;y++){m[y]=[];for(var x=0;x<c;x++)m[y][x]=1;}
    function carve(x,y){ m[y][x]=0;
      [[0,-2],[0,2],[-2,0],[2,0]].sort(function(){return Math.random()-0.5;}).forEach(function(d){
        var nx=x+d[0], ny=y+d[1];
        if(nx>0&&ny>0&&nx<c-1&&ny<r-1&&m[ny][nx]===1){ m[y+d[1]/2][x+d[0]/2]=0; carve(nx,ny); } });
    }
    carve(1,1); return m;
  }
  function build(){
    cols=Math.min(21, 9+level*2); rows=Math.min(15, 7+level*2);
    if(cols%2===0)cols++; if(rows%2===0)rows++;
    g=gen(cols,rows); px=1; py=1;
    var maxW=Math.min(window.innerWidth-24, 640), maxH=window.innerHeight-200;
    S=Math.max(16, Math.floor(Math.min(maxW/cols, maxH/rows)));
    cv.width=cols*S; cv.height=rows*S;
    document.getElementById('lv').textContent='미로 '+level;
    document.getElementById('hi').textContent='🏆 '+KID.hiGet('maze');
    render();
  }
  function render(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      if(g[y][x]===1){ ctx.fillStyle='#4a7ad6'; ctx.fillRect(x*S,y*S,S,S); }
    }
    ctx.font=(S*0.8)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏁',(cols-2+0.5)*S,(rows-2+0.5)*S);
    ctx.fillText('🐢',(px+0.5)*S,(py+0.5)*S);
  }
  function move(d){
    var nx=px,ny=py;
    if(d==='U')ny--; else if(d==='D')ny++; else if(d==='L')nx--; else if(d==='R')nx++;
    if(nx<0||ny<0||nx>=cols||ny>=rows||g[ny][nx]===1) return;
    px=nx; py=ny; KID.click(); render();
    if(px===cols-2&&py===rows-2){ win(); }
  }
  function win(){
    KID.fanfare(); KID.hiSet('maze',level);
    var c=document.getElementById('cheer'); c.style.transition='none'; c.style.opacity='1'; c.style.transform='scale(1.4)';
    setTimeout(function(){ c.style.transition='opacity .7s,transform .7s'; c.style.opacity='0'; c.style.transform='scale(1)'; },30);
    level++; setTimeout(build,700);
  }
  document.addEventListener('keydown',function(e){ var k={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};
    if(k[e.key]){ e.preventDefault(); move(k[e.key]); } });
  document.querySelectorAll('#pad button').forEach(function(b){ b.addEventListener('click',function(){ move(b.dataset.d); }); });
  window.addEventListener('resize',build);
  build();
})();
</script>
</body>
</html>
