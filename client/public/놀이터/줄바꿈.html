<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>줄바꿈</title>
<link rel="stylesheet" href="kid.css">
<style>
  #main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px;}
  #guide{font-size:19px;font-weight:800;color:#2a63d6;text-align:center;}
  #disp{font-size:56px;font-weight:800;line-height:1.4;background:#ffffffcc;border-radius:18px;padding:16px 34px;box-shadow:0 4px 12px #0002;min-height:110px;min-width:240px;text-align:left;}
  #disp .cursor{color:#e07b1a;font-weight:900;animation:bl .6s step-end infinite;}
  #disp .hintmk{color:#2ac66b;font-weight:900;}
  @keyframes bl{50%{opacity:0.2;}}
  #fb{font-size:36px;height:46px;}
  #ctrl{display:flex;gap:10px;align-items:center;}
  #ctrl button{font-size:26px;font-weight:800;border:none;border-radius:16px;padding:14px 22px;box-shadow:0 4px 0 #0002;}
  #ctrl .mv{background:#fff;} #enter{background:#ffd08a;}
  #ctrl button:active{transform:translateY(3px);}
  #score{font-size:22px;font-weight:800;}
</style>
</head>
<body>
  <div class="topbar"><a class="home" href="글자놀이.html">⬅ 글자놀이</a><span class="title">⏎ 줄바꿈</span>
    <span class="spacer"></span><span id="score">⭐ 0</span></div>
  <div id="main">
    <div id="guide">⬅️➡️ 로 커서(주황 |)를 낱말 사이로 옮기고<br>[ Enter ↵ ] 로 줄을 바꿔요!</div>
    <div id="disp"></div>
    <div id="fb"></div>
    <div id="ctrl">
      <button class="mv" data-d="-1">⬅️</button>
      <button id="enter">↵ Enter</button>
      <button id="hint" style="background:#ffe08a;box-shadow:0 4px 0 #0002;">💡</button>
      <button class="mv" data-d="1">➡️</button>
    </div>
  </div>
<script src="kid.js?v=3"></script>
<script>
(function(){
  var SETS=[['하늘','바다','나무'],['사과','포도','딸기'],['빨강','노랑','파랑'],['토끼','거북이','다람쥐'],
    ['봄','여름','가을','겨울'],['해','달','별'],['엄마','아빠','나'],['하나','둘','셋']];
  var words=[], text='', correctGaps=[], accepted=[], cursor=1, score=0, locked=false, hintOn=false;
  var disp=document.getElementById('disp'), fb=document.getElementById('fb');
  function pick(){ words=SETS[Math.floor(Math.random()*SETS.length)]; text=words.join('');
    correctGaps=[]; var g=0; for(var i=0;i<words.length-1;i++){ g+=words[i].length; correctGaps.push(g); }
    accepted=[]; cursor=1; locked=false; fb.textContent=''; render(); }
  function render(){ var h=''; for(var i=0;i<text.length;i++){
      if(accepted.indexOf(i)>=0) h+='<br>';
      if(hintOn && i===correctGaps[accepted.length]) h+='<span class="hintmk">▾</span>';
      if(i===cursor) h+='<span class="cursor">|</span>';
      h+=text[i]; } disp.innerHTML=h; }
  function move(d){ if(locked)return; cursor=Math.min(text.length-1,Math.max(1,cursor+d)); KID.click(); render(); }
  function enter(){ if(locked)return;
    if(cursor===correctGaps[accepted.length]){ accepted.push(cursor); KID.pop(); fb.textContent='';
      if(accepted.length===correctGaps.length){ locked=true; score++; var rec=KID.hiSet('newline',score);
        document.getElementById('score').innerHTML='⭐ '+score+' &nbsp; 🏆 '+KID.hiGet('newline');
        KID.good(); fb.textContent='🎉 잘했어요!'; setTimeout(pick,1000); } render(); }
    else { KID.bad(); fb.textContent='❌ 거기가 아니에요!'; setTimeout(function(){ if(!locked) fb.textContent=''; },900); } }
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){ e.preventDefault(); move(-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); move(1); }
    else if(e.key==='Enter'){ e.preventDefault(); enter(); } });
  document.querySelectorAll('#ctrl .mv').forEach(function(b){ b.addEventListener('click',function(){ move(parseInt(b.dataset.d,10)); }); });
  document.getElementById('enter').addEventListener('click',enter);
  document.getElementById('hint').addEventListener('click',function(){ if(locked)return; KID.click(); hintOn=true; render(); setTimeout(function(){ hintOn=false; render(); },1800); });
  document.getElementById('score').innerHTML='⭐ 0 &nbsp; 🏆 '+KID.hiGet('newline');
  pick();
})();
</script>
</body>
</html>
