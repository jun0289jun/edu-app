<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>계수기</title>
<link rel="stylesheet" href="kid.css">
<style>
  #main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px;}
  #num{font-size:clamp(40px,12vw,110px);font-weight:800;line-height:1.1;letter-spacing:2px;background:#233;color:#fff;
    border-radius:20px;padding:14px 30px;box-shadow:0 6px 18px #0003;font-variant-numeric:tabular-nums;max-width:96vw;
    word-break:break-all;text-align:center;}
  #row{display:flex;gap:16px;align-items:center;}
  .big{font-size:52px;font-weight:800;border:none;border-radius:24px;width:104px;height:104px;box-shadow:0 6px 0 #0003;}
  #minus{background:#ff9db0;color:#fff;} #plus{background:#8be78b;color:#fff;}
  .big:active{transform:translateY(4px);}
  #inclbl{font-size:18px;font-weight:800;color:#0009;}
  #tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  #tools .btn{font-size:18px;padding:12px 18px;}
  .say{background:#a1c4fd;color:#fff;} .rnd{background:#ffd08a;}
  #gear{font-size:22px;background:#fff;border:none;border-radius:14px;width:46px;height:46px;box-shadow:0 3px 0 #0002;cursor:pointer;}
  #gear:active{transform:translateY(2px);}
  #settings{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:10;}
  #settings.open{display:flex;}
  #settings .panel{background:#fff;border-radius:18px;padding:20px;width:min(92vw,420px);}
  #settings h2{margin:0 0 12px;}
  #settings label{display:block;font-size:16px;font-weight:800;margin:14px 0 6px;}
  #settings select{width:100%;font-size:20px;font-weight:800;padding:10px;border-radius:12px;border:3px solid #ddd;}
</style>
</head>
<body>
  <div class="topbar"><a class="home" href="숫자놀이.html">🏠 숫자놀이</a><span class="title">🔟 계수기</span>
    <span class="spacer"></span><button id="gear" title="설정">⚙️</button></div>
  <div id="main">
    <div id="num">0</div>
    <div id="inclbl">+1 씩</div>
    <div id="row">
      <button class="big" id="minus">➖</button>
      <button class="big" id="plus">➕</button>
    </div>
    <div id="tools">
      <button class="btn rnd" id="rnd">🎲 랜덤</button>
      <button class="btn" id="zero">0으로</button>
      <button class="btn say" data-l="ko">🔊 한국어</button>
      <button class="btn say" data-l="en">🔊 English</button>
    </div>
  </div>

  <div id="settings"><div class="panel">
    <h2>⚙️ 설정</h2>
    <label>자릿수 (얼마나 큰 수까지)</label>
    <select id="digits">
      <option value="1">1자리 (0~9)</option>
      <option value="2">2자리 (~99)</option>
      <option value="3">3자리 (~999)</option>
      <option value="4">4자리 (~9,999)</option>
      <option value="5">5자리 (~9만)</option>
      <option value="6">6자리 (~99만)</option>
      <option value="7">7자리 (~999만)</option>
      <option value="8">8자리 (~9,999만)</option>
      <option value="9">9자리 (~9억)</option>
    </select>
    <label>증가치 (한 번에 얼마씩)</label>
    <select id="inc">
      <option value="1">1</option><option value="10">10</option><option value="100">100</option>
      <option value="1000">1,000 (천)</option><option value="10000">10,000 (만)</option>
      <option value="100000">100,000 (십만)</option><option value="1000000">1,000,000 (백만)</option>
      <option value="10000000">10,000,000 (천만)</option><option value="100000000">100,000,000 (억)</option>
    </select>
    <div style="margin-top:16px;text-align:right"><button class="btn" id="close" style="background:#8be78b">닫기</button></div>
  </div></div>
<script src="kid.js"></script>
<script>
  var digits=1, inc=1, count=0;
  function max(){ return Math.pow(10,digits)-1; }
  function render(){ document.getElementById('num').textContent = count.toLocaleString('en-US');
    document.getElementById('inclbl').textContent = '+'+inc.toLocaleString('en-US')+' 씩'; }
  function set(n,speak){ var m=max()+1; count=((n%m)+m)%m; render(); if(speak!==false) KID.speak(KID.numKor(count),'ko'); }
  document.getElementById('plus').onclick=function(){ KID.pop(); set(count+inc); };
  document.getElementById('minus').onclick=function(){ KID.pop(); set(count-inc); };
  document.getElementById('rnd').onclick=function(){ KID.click(); set(Math.floor(Math.random()*(max()+1))); };
  document.getElementById('zero').onclick=function(){ KID.click(); set(0,false); };
  document.querySelectorAll('.say').forEach(function(b){ b.onclick=function(){ KID.speak(b.dataset.l==='ko'?KID.numKor(count):count,b.dataset.l); }; });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'||e.key==='+'){ e.preventDefault(); set(count+inc); }
    else if(e.key==='ArrowDown'||e.key==='-'){ e.preventDefault(); set(count-inc); } });
  // 설정
  document.getElementById('gear').onclick=function(){ document.getElementById('settings').classList.add('open'); };
  document.getElementById('close').onclick=function(){ document.getElementById('settings').classList.remove('open'); };
  document.getElementById('settings').onclick=function(e){ if(e.target.id==='settings') this.classList.remove('open'); };
  document.getElementById('digits').onchange=function(){ digits=parseInt(this.value,10); if(count>max())count=0; if(inc>max())inc=1,document.getElementById('inc').value='1'; render(); };
  document.getElementById('inc').onchange=function(){ inc=parseInt(this.value,10); render(); };
  render();
</script>
</body>
</html>
